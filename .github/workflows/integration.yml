name: integration

# 실제 LiteLLM 파생 이미지 2복제본·Postgres·정책 엔진·장애 주입 서버·계수 프록시로 인수시험을 실행한다.
# 병합 필수 검사가 아니다. 집행 경로·배포·정책이 바뀌는 변경과 main 푸시, 수동 실행에서 돈다.
on:
  pull_request:
    paths:
      - "src/mint_litellm/plugin/**"
      - "src/mint_litellm/control/**"
      - "src/mint_litellm/compat/**"
      - "src/mint_litellm/types/**"
      - "deploy/**"
      - "policy/**"
      - "tests/integration/**"
      - "uv.lock"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "src/mint_litellm/**"
      - "deploy/**"
      - "policy/**"
      - "tests/integration/**"
      - "uv.lock"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # main 푸시는 커밋마다 그룹이 달라(sha) 서로 취소하지 않는다. PR은 같은 그룹이라 새 푸시가 이전 실행을 취소한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra litellm
      - name: 스택 기동
        run: docker compose -p mint-e -f tests/integration/compose.yaml --profile plain up -d --build --wait
        timeout-minutes: 15
      - name: 인수시험
        run: uv run --no-sync pytest tests/integration -ra --durations=15 -o faulthandler_timeout=300
        env:
          MINT_INTEGRATION_REQUIRED: "1"
        timeout-minutes: 60
      - name: 실패 시 컨테이너 로그 수집
        if: failure()
        run: |
          mkdir -p integration-logs
          docker compose -p mint-e -f tests/integration/compose.yaml --profile plain ps -a > integration-logs/ps.txt
          docker compose -p mint-e -f tests/integration/compose.yaml --profile plain logs --no-color --timestamps > integration-logs/compose.log
      - name: 로그 아티팩트 업로드
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: integration-logs
          retention-days: 7
      - name: 스택 정리
        if: always()
        run: docker compose -p mint-e -f tests/integration/compose.yaml --profile plain down -v --remove-orphans
