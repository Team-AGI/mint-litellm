name: litellm-latest

# 최신 LiteLLM 릴리스에서 호환 계약 시험만 돌린다. 병합 필수 검사가 아니며 PR에서는 돌지 않는다.
# 이 시험이 깨지면 새 판본이 MINT가 쓰는 훅 지점을 바꾼 것이다.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: 별도 환경에 최신 LiteLLM 설치
        run: |
          uv venv /tmp/latest
          uv pip install --no-config --python /tmp/latest/bin/python -e ".[dev]" "litellm[proxy]"
          /tmp/latest/bin/python -c "import importlib.metadata as m; print('litellm', m.version('litellm'))"
      - name: 계약 시험
        run: /tmp/latest/bin/python -m pytest tests/unit/compat -q
        env:
          MINT_ALLOW_UNTESTED_LITELLM: "true"
