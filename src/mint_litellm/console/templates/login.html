<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINT 관리자 콘솔 로그인</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/console.css">
</head>
<body>
<div class="login">
  <h1>MINT 관리자 콘솔</h1>
  {% if error %}<div class="banner error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <label>아이디<input name="username" autocomplete="username" autofocus required></label>
    <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">로그인</button>
  </form>
  {% if sso %}
  <a class="button" href="/auth/oidc/login?target=admin">SSO로 로그인</a>
  {% endif %}
  {% if key_login %}
  <form method="post" action="/login" class="form">
    <label>LiteLLM 키<input type="password" name="key" autocomplete="off" required></label>
    <button type="submit">키로 로그인</button>
  </form>
  {% endif %}
  <p><a href="/staff/login">직원 화면 로그인</a>{% if litellm_ui_url %} · <a href="{{ litellm_ui_url }}">LiteLLM 관리 화면</a>{% endif %}</p>
</div>
</body>
</html>
