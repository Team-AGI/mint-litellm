worker_processes 2;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  map $request_body $rpc_method { default "-"; '~"method"\s*:\s*"(?<m>[^"]+)"' $m; }
  log_format counted escape=json '{"t":"$msec","path":"$request_uri","http":"$request_method","status":"$status","rpc":"$rpc_method"}';
  access_log /var/log/nginx/counted.jsonl counted;
  client_body_buffer_size 1m;
  client_max_body_size 1m;
  client_body_in_single_buffer on;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate /etc/nginx/certs/cnt.pem;
    ssl_certificate_key /etc/nginx/certs/cnt.key;
    location = /__health { access_log off; default_type text/plain; return 200 "ok"; }
    location = /__log { access_log off; default_type text/plain; alias /var/log/nginx/counted.jsonl; }
    location /playwright/ { set $up http://mcp-playwright:8931; rewrite ^/playwright/(.*)$ /$1 break; proxy_pass $up; include /etc/nginx/proxy.inc; }
    location /context7/   { set $up http://mcp-context7:3000;   rewrite ^/context7/(.*)$ /$1 break;   proxy_pass $up; include /etc/nginx/proxy.inc; }
    location /grafana/    { set $up http://mcp-grafana:8000;    rewrite ^/grafana/(.*)$ /$1 break;    proxy_pass $up; include /etc/nginx/proxy.inc; }
    location /synthetic/  { set $up http://fixture:8940;        rewrite ^/synthetic/(.*)$ /$1 break;  proxy_pass $up; include /etc/nginx/proxy.inc; }
  }
}
