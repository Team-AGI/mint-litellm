worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }

http {
  access_log /dev/stdout;
  server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    ssl_certificate /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    location = /__health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # 인증서 뒤는 계수 프록시의 서버 a이다. 호출은 그쪽 기록에 남는다.
    location /mcp {
      proxy_pass http://counting-proxy:8080/a/mcp;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host counting-proxy:8080;
      proxy_buffering off;
    }
  }
}
