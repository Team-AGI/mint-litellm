name: mint-e

# 통합 시험 전용 스택. 시험 서버는 배포 묶음과 승인 목록 밖이며 이 파일에서만 쓴다.
# 네트워크: front(LiteLLM·계수 프록시·Postgres·OPA)와 back(계수 프록시·Toxiproxy·시험 서버)을 나눠
# LiteLLM이 시험 서버에 계수 프록시를 거치지 않고는 닿을 수 없게 한다.
# LiteLLM 복제본 2개는 배포 묶음과 같은 파생 이미지(플러그인 설치, 기동 전 설정 검사)를 쓴다.

x-mint-env: &mint-env
  MINT_INSTANCE_ID: integration
  MINT_MODE: observe
  MINT_REQUIRED: ${MINT_E_REQUIRED:-true}
  MINT_BUFFER_MAX_BYTES: ${MINT_E_BUFFER_MAX_BYTES:-52428800}
  MINT_HIGH_RISK_TOOLS: ${MINT_E_HIGH_RISK_TOOLS:-}
  MINT_OPA_URL: http://opa:8181
  MINT_BUFFER_DIR: /var/lib/mint/buffer
  MINT_DB_POOL_SIZE: "8"
  MINT_DECISION_BUDGET_MS: ${MINT_E_DECISION_BUDGET_MS:-2000}
  MINT_READINESS_URL: http://localhost:4000/health/readiness
  MINT_SELFCHECK_GRACE_SECONDS: "60"
  MINT_FINGERPRINT_KEY: BwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSY
  MINT_FINGERPRINT_KEY_VERSION: "1"
  # 시험 전용 값이며 실제 비밀이 아니다(base64url 32바이트).
  MINT_EXPORT_DIR: /var/lib/mint/export
  MINT_EXPORT_HMAC_KEY: ${MINT_E_EXPORT_HMAC_KEY:-dGVzdC1vbmx5LWV4cG9ydC1obWFjLWtleS0wMDAwMDA}

x-litellm-env: &litellm-env
  <<: *mint-env
  LITELLM_MASTER_KEY: ${MINT_E_MASTER_KEY:-sk-integration-master}
  LITELLM_SALT_KEY: ${MINT_E_SALT_KEY:-sk-integration-salt}
  DATABASE_URL: postgresql://postgres:${MINT_E_DB_PASSWORD:-integration-db}@postgres:5432/litellm
  MINT_DATABASE_URL: postgresql://mint_plugin_app:${MINT_E_PLUGIN_PASSWORD:-integration-plugin}@${MINT_E_PLUGIN_DB_HOST:-toxiproxy-db}:${MINT_E_PLUGIN_DB_PORT:-8668}/mint
  LITELLM_LOG: INFO

x-litellm: &litellm
  image: ${MINT_E_IMAGE:-mint-litellm-it:local}
  environment: *litellm-env
  command: ["--config", "/app/config/litellm.config.yaml", "--port", "4000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/readiness', timeout=3).read()"]
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 30s
  networks: [front]

x-testserver: &testserver
  build:
    context: ./mcp_testserver
    args:
      MCP_VERSION: "1.30.0"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9001/health', timeout=3).read()"]
    interval: 3s
    timeout: 3s
    retries: 20
  networks: [back]

services:
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MINT_E_DB_PASSWORD:-integration-db}
      POSTGRES_DB: litellm
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-mint.sql:ro
    ports:
      - "${MINT_E_PORT_PREFIX:-}4132:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litellm && psql -U postgres -d mint -c 'select 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [front]

  # 마이그레이션·로그인 역할·기본 조직·첫 정책 번들을 만들고 끝난다.
  mint-init:
    image: ${MINT_E_IMAGE:-mint-litellm-it:local}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.litellm
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p -m 700 /tmp/mint && mint-litellm init --out /tmp/mint/mint.yaml --secrets-file /tmp/mint/secrets.env --json >/dev/null &&
        python -c "from pathlib import Path;
        from mint_litellm.plugin.policy.bundle import prepare_bundle, publish_bundle;
        target = Path('/bundles/mint.tar.gz');
        target.exists() or publish_bundle(target, prepare_bundle(Path('/opt/mint'), 'initial').archive)"
    environment:
      <<: *mint-env
      MINT_DATABASE_URL: postgresql://postgres:${MINT_E_DB_PASSWORD:-integration-db}@postgres:5432/mint
      MINT_PLUGIN_DB_PASSWORD: ${MINT_E_PLUGIN_PASSWORD:-integration-plugin}
      MINT_CONTROL_DB_PASSWORD: ${MINT_E_CONTROL_PASSWORD:-integration-control}
      MINT_WORKER_DB_PASSWORD: ${MINT_E_WORKER_PASSWORD:-integration-worker}
      MINT_STAFF_DB_PASSWORD: ${MINT_E_STAFF_PASSWORD:-integration-staff}
    volumes:
      - bundles:/bundles
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [front]

  opa:
    image: openpolicyagent/opa:1.21.4@sha256:12420358d3f22a0cd2424ddc44a16e292ecb42825d3dfbca779986006822a3f6
    command: ["run", "--server", "--addr=:8181", "--bundle", "--watch", "/bundles/mint.tar.gz"]
    volumes:
      - bundles:/bundles:ro
    ports:
      - "${MINT_E_PORT_PREFIX:-}4181:8181"
    depends_on:
      mint-init:
        condition: service_completed_successfully
    networks: [front]

  # 운영자 명령줄 도구를 실행하는 컨테이너. 시험은 docker compose exec로 명령을 보낸다.
  control:
    image: ${MINT_E_IMAGE:-mint-litellm-it:local}
    entrypoint: ["sleep", "infinity"]
    environment:
      <<: *mint-env
      MINT_DATABASE_URL: postgresql://mint_control_app:${MINT_E_CONTROL_PASSWORD:-integration-control}@postgres:5432/mint
      MINT_LITELLM_URL: http://litellm1:4000
      MINT_LITELLM_CONFIG: /app/config/litellm.config.yaml
      MINT_POLICY_ROOT: /opt/mint
      MINT_OPA_BUNDLE_PATH: /bundles/mint.tar.gz
    volumes:
      - ${MINT_E_LITELLM_CONFIG:-./config/litellm.mint.yaml}:/app/config/litellm.config.yaml:ro
      - ./config:/work/config:ro
      - bundles:/bundles
      - export:/var/lib/mint/export
    depends_on:
      mint-init:
        condition: service_completed_successfully
    networks: [front]

  # 작업 실행기. 기동 직후 첫 체크포인트(latest.json)를 쓴다. LiteLLM은 같은 볼륨을 읽기 전용으로 본다.
  worker:
    image: ${MINT_E_IMAGE:-mint-litellm-it:local}
    entrypoint: ["mint-litellm"]
    command: ["worker"]
    environment:
      <<: *mint-env
      MINT_DATABASE_URL: postgresql://mint_worker_app:${MINT_E_WORKER_PASSWORD:-integration-worker}@postgres:5432/mint
      MINT_OPA_URL: http://opa:8181
      # 배포 묶음과 같은 이름이다. 전 구간 흐름 시험이 관리 키·짧은 관측 주기·수용검증 허용 포트로 다시 띄운다.
      MINT_LITELLM_URL: http://litellm1:4000
      MINT_LITELLM_KEY: ${MINT_E_WORKER_LITELLM_KEY:-}
      MINT_OBSERVE_SECONDS: ${MINT_E_OBSERVE_SECONDS:-3600}
      MINT_INTAKE_ALLOWED_PORTS: ${MINT_E_INTAKE_PORTS:-}
    volumes:
      - export:/var/lib/mint/export
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if pathlib.Path('/var/lib/mint/export/integration/latest.json').is_file() else 1)"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      mint-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks: [front]

  testserver-a:
    <<: *testserver
    environment:
      INSTANCE_ID: upstream-a
    ports:
      - "${MINT_E_PORT_PREFIX:-}4191:9001"

  testserver-b:
    <<: *testserver
    environment:
      INSTANCE_ID: upstream-b
    ports:
      - "${MINT_E_PORT_PREFIX:-}4192:9001"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "${MINT_E_PORT_PREFIX:-}4174:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      testserver-a:
        condition: service_healthy
      testserver-b:
        condition: service_healthy
    networks: [back]

  toxiproxy-db:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./toxiproxy-db.json:/etc/toxiproxy.json:ro
    ports:
      - "${MINT_E_PORT_PREFIX:-}4175:8474"
      - "${MINT_E_PORT_PREFIX:-}4176:8668"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks: [front]

  counting-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./counting_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./counting_proxy/mcp_proxy.conf:/etc/nginx/mcp_proxy.conf:ro
    ports:
      - "${MINT_E_PORT_PREFIX:-}4180:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://counting-proxy:8080/__health"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      toxiproxy:
        condition: service_healthy
    networks: [front, back]

  litellm1:
    <<: *litellm
    ports:
      - "${MINT_E_PORT_PREFIX:-}4101:4000"
    volumes:
      - ${MINT_E_LITELLM_CONFIG:-./config/litellm.mint.yaml}:/app/config/litellm.config.yaml:ro
      - ./guardrails/it_guardrails.py:/app/config/it_guardrails.py:ro
      - buffer1:/var/lib/mint/buffer${MINT_E_BUFFER1_MODE:-}
      - export:/var/lib/mint/export:ro
    depends_on:
      mint-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      counting-proxy:
        condition: service_healthy

  litellm2:
    <<: *litellm
    ports:
      - "${MINT_E_PORT_PREFIX:-}4102:4000"
    volumes:
      - ${MINT_E_LITELLM_CONFIG:-./config/litellm.mint.yaml}:/app/config/litellm.config.yaml:ro
      - ./guardrails/it_guardrails.py:/app/config/it_guardrails.py:ro
      - buffer2:/var/lib/mint/buffer
      - export:/var/lib/mint/export:ro
    depends_on:
      litellm1:
        condition: service_healthy

  # 플러그인이 없는 순정 이미지. 기반 동작 시험과 순정 구성 점검에 쓴다.
  litellm-plain:
    image: ghcr.io/berriai/litellm-database:v1.106.6@sha256:7ef0e78fe00ad5ea7ea45666cc1d1f02cb7076aee69091543bf397de52db33ce
    profiles: [plain]
    environment:
      LITELLM_MASTER_KEY: ${MINT_E_MASTER_KEY:-sk-integration-master}
      LITELLM_SALT_KEY: ${MINT_E_SALT_KEY:-sk-integration-salt}
      DATABASE_URL: postgresql://postgres:${MINT_E_DB_PASSWORD:-integration-db}@postgres:5432/litellm
    volumes:
      - ./config/litellm.plain.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/readiness', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - "${MINT_E_PORT_PREFIX:-}4103:4000"
    depends_on:
      litellm1:
        condition: service_healthy
    networks: [front]

networks:
  front: {}
  back: {}

volumes:
  bundles:
  buffer1:
  buffer2:
  export:
