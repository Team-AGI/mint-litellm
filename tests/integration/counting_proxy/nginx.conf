worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  # 본문 전체는 남기지 않고 JSON-RPC 메서드와 시험 표식만 뽑아 기록한다.
  map $request_body $rpc_method {
    default "-";
    '~"method"\s*:\s*"(?<m>[^"]+)"' $m;
  }
  map $request_body $rpc_marker {
    default "";
    '~"marker"\s*:\s*"(?<k>[^"]+)"' $k;
  }

  log_format counted escape=json
    '{"t":"$msec","id":"$request_id","http":"$request_method","path":"$uri","status":"$status",'
    '"upstream_status":"$upstream_status","rpc":"$rpc_method","marker":"$rpc_marker"}';

  access_log /var/log/nginx/counted.jsonl counted;
  access_log /dev/stdout counted;

  client_body_buffer_size 1m;
  client_max_body_size 1m;
  client_body_in_single_buffer on;

  server {
    listen 8080;

    location = /__health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    location = /__log {
      access_log off;
      default_type text/plain;
      alias /var/log/nginx/counted.jsonl;
    }

    location /a/ {
      proxy_pass http://toxiproxy:8666/;
      include /etc/nginx/mcp_proxy.conf;
    }

    location /d/ {
      proxy_pass http://toxiproxy:8666/;
      include /etc/nginx/mcp_proxy.conf;
    }

    location /c/ {
      proxy_pass http://toxiproxy:8667/;
      include /etc/nginx/mcp_proxy.conf;
    }

    location /b/ {
      proxy_pass http://toxiproxy:8667/;
      include /etc/nginx/mcp_proxy.conf;
    }
    # 전송 회귀 시험용: 같은 시험 서버 프로세스의 조합별 포트로 간다(장애 주입 프록시를 거치지 않는다).
    location /e/ {
      proxy_pass http://testserver-a:9005/;
      include /etc/nginx/mcp_proxy.conf;
    }

    location /f/ {
      proxy_pass http://testserver-a:9002/;
      include /etc/nginx/mcp_proxy.conf;
    }

    location /g/ {
      proxy_pass http://testserver-a:9003/;
      include /etc/nginx/mcp_proxy.conf;
    }

    location /h/ {
      proxy_pass http://testserver-a:9004/;
      include /etc/nginx/mcp_proxy.conf;
    }

    # LiteLLM 재사용 정책 시험(test_reuse_runtime): 인증 서버 메타데이터 발견 경로.
    # 401 응답이 보호 자원 메타데이터 주소를 알린다. cross는 다른 출처(8081), same은 같은 출처이다.
    location = /oauth/cross/mcp {
      add_header WWW-Authenticate 'Bearer resource_metadata="http://counting-proxy:8081/oauth/prm-cross"' always;
      return 401;
    }

    location = /oauth/same/mcp {
      add_header WWW-Authenticate 'Bearer resource_metadata="http://counting-proxy:8080/oauth/prm-same"' always;
      return 401;
    }

    location = /oauth/prm-same {
      default_type application/json;
      return 200 '{"resource":"http://counting-proxy:8080/oauth/same/mcp","authorization_servers":["http://counting-proxy:8080/idp"]}';
    }

    # 발급자를 고정한 서버가 읽는 인증 서버 메타데이터. idp2는 응답에 iss를 싣는다고 알린다(RFC 9207).
    location = /.well-known/oauth-authorization-server/idp {
      default_type application/json;
      return 200 '{"issuer":"http://counting-proxy:8080/idp","authorization_endpoint":"http://idp.invalid/authorize","token_endpoint":"http://idp.invalid/token"}';
    }

    location = /.well-known/oauth-authorization-server/idp2 {
      default_type application/json;
      return 200 '{"issuer":"http://counting-proxy:8080/idp2","authorization_endpoint":"http://idp.invalid/authorize","token_endpoint":"http://idp.invalid/token","authorization_response_iss_parameter_supported":true}';
    }
  }

  server {
    listen 8081;

    location = /oauth/prm-cross {
      default_type application/json;
      return 200 '{"resource":"http://counting-proxy:8080/oauth/cross/mcp","authorization_servers":["http://counting-proxy:8080/idp"]}';
    }
  }
}
