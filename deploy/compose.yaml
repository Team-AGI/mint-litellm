name: mint

services:
  # PostgreSQL 16.15
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하십시오}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 번들 모드(--bundle)로 띄우고 번들 파일을 감시한다. --bundle 없이 타르볼을 감시하면 재적재 때
  # 이전 파일과 새 파일이 함께 남아 적재가 실패한다. 번들 디렉터리는 제어 평면 컨테이너와 공유하는
  # 명명 볼륨이어야 하며, 호스트 디렉터리 바인드 마운트는 파일 변경 알림이 전달되지 않는다.
  opa:
    image: openpolicyagent/opa:1.21.4@sha256:12420358d3f22a0cd2424ddc44a16e292ecb42825d3dfbca779986006822a3f6
    command: ["run", "--server", "--addr", ":8181", "--bundle", "--watch", "/bundles/mint.tar.gz"]
    volumes:
      - bundles:/bundles:ro
    restart: unless-stopped

  litellm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.litellm
    image: mint-litellm:${COMPOSE_PROJECT_NAME:-local}
    command: ["--config", "/app/config/litellm.config.yaml", "--port", "4000"]
    # 인자 지문 키(MINT_FINGERPRINT_KEY, MINT_FINGERPRINT_KEY_VERSION)는 저장소 밖 비밀 파일에서 읽는다.
    env_file:
      - path: ${MINT_SECRETS_DIR:?MINT_SECRETS_DIR를 .env에 설정하십시오}/secrets.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY를 .env에 설정하십시오}
      STORE_MODEL_IN_DB: "True"
      PROXY_BASE_URL: ${PROXY_BASE_URL:-}
      MCP_TRUSTED_REDIRECT_ORIGINS: ${MCP_TRUSTED_REDIRECT_ORIGINS:-}
      MINT_INSTANCE_ID: ${MINT_INSTANCE_ID:-default}
      MINT_MODE: ${MINT_MODE:-enforce}
      MINT_DATABASE_URL: postgresql://mint_plugin_app:${MINT_PLUGIN_DB_PASSWORD}@postgres:5432/mint
      MINT_OPA_URL: http://opa:8181
      MINT_BUFFER_DIR: /var/lib/mint/buffer
      MINT_BUFFER_MAX_BYTES: ${MINT_BUFFER_MAX_BYTES:-52428800}
      MINT_DB_POOL_SIZE: ${MINT_DB_POOL_SIZE:-4}
      # 컨테이너당 LiteLLM 워커 프로세스 수. 워커마다 이벤트 루프가 따로라 동시 호출이 서로를 기다리지 않는다.
      NUM_WORKERS: ${MINT_LITELLM_WORKERS:-2}
      MINT_DECISION_BUDGET_MS: ${MINT_DECISION_BUDGET_MS:-300}
      MINT_READINESS_URL: http://localhost:4000/health/readiness
      MINT_SELFCHECK_GRACE_SECONDS: ${MINT_SELFCHECK_GRACE_SECONDS:-30}
      MINT_LOG_LEVEL: ${MINT_LOG_LEVEL:-}
      MINT_EXPORT_DIR: /var/lib/mint/export
      MINT_EXPORT_HMAC_KEY: ${MINT_EXPORT_HMAC_KEY:?MINT_EXPORT_HMAC_KEY를 .env에 설정하십시오}
      MINT_EXPORT_HMAC_KEY_PREVIOUS: ${MINT_EXPORT_HMAC_KEY_PREVIOUS:-}
      MINT_OBSERVE_SECONDS: ${MINT_OBSERVE_SECONDS:-3600}
    ports:
      - "${MINT_LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config:/app/config:ro
      - buffer:/var/lib/mint/buffer
      - export:/var/lib/mint/export:ro
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # 운영자 명령줄 도구. 예: docker compose run --rm control status
  # 호스트의 비밀 디렉터리(소유자는 설치한 사용자)에 쓰므로 이 도구만 루트로 실행한다. 장기 실행 서비스는 비루트이다.
  control:
    image: mint-litellm:${COMPOSE_PROJECT_NAME:-local}
    user: "0"
    profiles: ["tools"]
    entrypoint: ["mint-litellm"]
    env_file:
      - .env
      - path: ${MINT_SECRETS_DIR:?MINT_SECRETS_DIR를 .env에 설정하십시오}/secrets.env
        required: false
    environment:
      MINT_SECRETS_FILE: /run/mint-secrets/secrets.env
      MINT_DATABASE_URL: postgresql://mint_control_app:${MINT_CONTROL_DB_PASSWORD}@postgres:5432/mint
      MINT_LITELLM_URL: http://litellm:4000
      MINT_LITELLM_CONFIG: /app/config/litellm.config.yaml
      MINT_OPERATOR_TOKEN: ${MINT_OPERATOR_TOKEN:-}
      MINT_OPA_URL: http://opa:8181
      MINT_LITELLM_WORKERS: ${MINT_LITELLM_WORKERS:-2}
      MINT_POLICY_ROOT: /opt/mint
      MINT_OPA_BUNDLE_PATH: /bundles/mint.tar.gz
      MINT_EXPORT_DIR: /var/lib/mint/export
      MINT_EXPORT_HMAC_KEY: ${MINT_EXPORT_HMAC_KEY:-}
      MINT_EXPORT_HMAC_KEY_PREVIOUS: ${MINT_EXPORT_HMAC_KEY_PREVIOUS:-}
    volumes:
      - ./config:/app/config
      - bundles:/bundles
      - export:/var/lib/mint/export
      - ${MINT_SECRETS_DIR}:/run/mint-secrets
    depends_on:
      postgres:
        condition: service_healthy

  # 작업 실행기(2단계). mint.sh up이 띄운다(직접: docker compose --profile worker up -d worker).
  # 내보내기 볼륨(export)은 LiteLLM 컨테이너에 읽기 전용으로, 작업 실행기·제어 도구에 읽기·쓰기로 연결한다.
  # 서명 키가 있어야 기동하며, 로그인 역할 mint_worker_app은 init에 MINT_WORKER_DB_PASSWORD를 주어 만든다.
  worker:
    image: mint-litellm:${COMPOSE_PROJECT_NAME:-local}
    profiles: ["worker"]
    command: ["worker"]
    entrypoint: ["mint-litellm"]
    environment:
      MINT_INSTANCE_ID: ${MINT_INSTANCE_ID:-default}
      MINT_DATABASE_URL: postgresql://mint_worker_app:${MINT_WORKER_DB_PASSWORD:?MINT_WORKER_DB_PASSWORD를 .env에 설정하십시오}@postgres:5432/mint
      MINT_EXPORT_DIR: /var/lib/mint/export
      MINT_EXPORT_HMAC_KEY: ${MINT_EXPORT_HMAC_KEY:?MINT_EXPORT_HMAC_KEY를 .env에 설정하십시오}
      MINT_EXPORT_HMAC_KEY_PREVIOUS: ${MINT_EXPORT_HMAC_KEY_PREVIOUS:-}
      MINT_WORKER_LEASE_SECONDS: ${MINT_WORKER_LEASE_SECONDS:-60}
      MINT_OBSERVE_SECONDS: ${MINT_OBSERVE_SECONDS:-3600}
      MINT_LITELLM_URL: http://litellm:4000
      MINT_LITELLM_KEY: ${MINT_LITELLM_KEY:-}
      MINT_OPA_URL: http://opa:8181
    volumes:
      - export:/var/lib/mint/export
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
    stop_grace_period: 30s
    restart: unless-stopped

  # 관리자 콘솔. ./mint.sh up·upgrade가 함께 띄운다.
  # 제어 평면 키(MINT_LITELLM_KEY)는 읽기 경로 전용으로만 쓰며 설치 기본은 설정이다. 쿠키가 Secure이므로 TLS는 앞단에서 끝내고 이 포트로 전달한다.
  console:
    image: mint-litellm:${COMPOSE_PROJECT_NAME:-local}
    profiles: ["console"]
    command: ["console", "--host", "*", "--port", "8080"]
    entrypoint: ["mint-litellm"]
    environment:
      MINT_INSTANCE_ID: ${MINT_INSTANCE_ID:-default}
      MINT_DATABASE_URL: postgresql://mint_control_app:${MINT_CONTROL_DB_PASSWORD:?MINT_CONTROL_DB_PASSWORD를 .env에 설정하십시오}@postgres:5432/mint
      MINT_STAFF_DATABASE_URL: postgresql://mint_staff_app:${MINT_STAFF_DB_PASSWORD:?MINT_STAFF_DB_PASSWORD를 .env에 설정하십시오}@postgres:5432/mint
      MINT_LITELLM_URL: http://litellm:4000
      MINT_LITELLM_KEY: ${MINT_LITELLM_KEY:-}
      MINT_KIT_ISSUER_KEY: ${MINT_KIT_ISSUER_KEY:-}
      MINT_ENDPOINT_PUBLIC_URL: ${MINT_ENDPOINT_PUBLIC_URL:-}
      MINT_EXPORT_DIR: /var/lib/mint/export
      MINT_EXPORT_HMAC_KEY: ${MINT_EXPORT_HMAC_KEY:?MINT_EXPORT_HMAC_KEY를 .env에 설정하십시오}
    ports:
      - "${MINT_CONSOLE_PORT:-8080}:8080"
    volumes:
      - export:/var/lib/mint/export:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  bundles:
  buffer:
  export:
